name: premiumpass-local

services:
  # Local database used by the BFF and subscription worker, without AWS access.
  # Host API: 127.0.0.1:8000; the named volume preserves records across restarts.
  dynamodb:
    image: amazon/dynamodb-local:3.3.1
    # The named volume must be writable; no host directories are mounted.
    user: '0:0'
    working_dir: /home/dynamodblocal
    command:
      - '-jar'
      - DynamoDBLocal.jar
      - '-sharedDb'
      - '-dbPath'
      - ./data
      - '-disableTelemetry'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  # Browser GUI for inspecting and editing the local DynamoDB tables.
  # Open 127.0.0.1:8001; this service stores no separate application data.
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    depends_on:
      - dynamodb
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      HOST: 0.0.0.0
      PORT: '8001'
    ports:
      - '127.0.0.1:8001:8001'

  # Local SQS-compatible broker between the Stripe webhook and the worker.
  # The mounted config creates the work queue and DLQ; host API is port 9324.
  # Messages live in memory and are lost when this container stops.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.16
    ports:
      - '127.0.0.1:9324:9324'
    volumes:
      - ./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  dynamodb-data:
