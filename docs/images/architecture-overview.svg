<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" role="img" aria-labelledby="title description">
  <title id="title">PremiumPass architecture overview</title>
  <desc id="description">Web and Mobile obtain access tokens from Auth0. The API verifies tokens with public signing keys and serves stored access. Verified Stripe, Apple, and Google notifications and client sync feed a queue. The worker verifies fresh provider state and commits subscriptions, access, completion, and outbox atomically. Local reconciliation starts with pnpm dev; AWS reconciliation uses one optional schedule with separate provider switches. Detailed runtime boundaries are documented separately.</desc>
  <metadata>Brand paths embedded from the Iconify Logos collection: apple, auth0-icon, google-icon, stripe. Source: https://github.com/iconify/icon-sets/blob/master/json/logos.json . Retrieved 2026-10-18. Brand artwork belongs to its respective owners. This SVG has no external image/font dependencies. Edit the SVG directly; keep the component responsibilities aligned with ARCHITECTURE.md.</metadata>
