<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title description">
<title id="title">The outbox pictured as an office mailroom</title>
<desc id="description">Four stations. The clerk, the subscription worker, updates the file and writes a letter in one move. The filing cabinet with an out-tray, DynamoDB, keeps the letter as a pending outbox entry next to the change. The mail carrier, the outbox publisher, posts waiting letters and then stamps the copy as sent. The post office and the recipient, the event queue and its consumer, deliver every letter at least once. Three notes: the API never waits for a letter; if the carrier is stopped, letters wait and go out on the next round; if the carrier crashes after posting but before stamping, the letter is posted again and its reference number, the domainEventId, lets the recipient skip the copy.</desc>
<metadata>Hand-written, self-contained SVG without external images or fonts. Keep the stations and notes aligned with docs/OUTBOX.md.</metadata>
<style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 30px; font-weight: 700; }
  .subtitle { font-size: 17px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  .name { font-size: 19px; font-weight: 700; }
  .note { font-size: 14px; }
  .chip { font-size: 13px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .mono { font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .callout { font-size: 17px; font-weight: 700; }
  .footer { font-size: 13px; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
  <symbol id="bolt" viewBox="0 0 20 30">
    <path d="M12.5 1.5L2 17h8l-2.5 11.5L18.5 12h-8l2-10.5z" fill="#f97316" stroke="#c2410c" stroke-width="1.5" stroke-linejoin="round"/>
  </symbol>
</defs>
<rect width="1000" height="620" rx="28" fill="#f8fafc"/>
<text x="48" y="66" class="title" fill="#0f172a">The outbox as an office mailroom</text>
<text x="48" y="98" class="subtitle" fill="#475569">The letter goes into the out-tray in the same move that updates the file.</text>

<!-- Station 1: the clerk = subscription worker -->
<rect x="48" y="128" width="196" height="276" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<g transform="translate(146 186)" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="-12" cy="-18" r="9"/>
  <path d="M-30 12c0-12 8-19 18-19s18 7 18 19"/>
  <rect x="12" y="-12" width="18" height="24" rx="2"/>
  <path d="M16 -5h10M16 1h10M16 7h6" fill="none" stroke-width="2"/>
  <path d="M-38 14h76M-32 14v14M32 14v14" fill="none"/>
</g>
<text x="146" y="248" class="name" fill="#115e59" text-anchor="middle">The clerk</text>
<text x="146" y="270" class="note" fill="#475569" text-anchor="middle">updates the file and</text>
<text x="146" y="289" class="note" fill="#475569" text-anchor="middle">writes the letter, too</text>
<path d="M68 308h156" stroke="#99f6e4" stroke-width="1.5"/>
<rect x="64" y="320" width="164" height="26" rx="13" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
<text x="146" y="338" class="chip" fill="#0f766e" text-anchor="middle">Subscription worker</text>
<text x="146" y="368" class="note" fill="#115e59" text-anchor="middle">commits access and the</text>
<text x="146" y="387" class="note" fill="#115e59" text-anchor="middle">outbox entry together</text>

<path d="M252 186h24" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Station 2: filing cabinet with out-tray = DynamoDB -->
<rect x="284" y="128" width="196" height="276" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<g transform="translate(382 190)" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-15" y="-38" width="30" height="21" rx="2"/>
  <path d="M-13 -35.5l13 9 13-9" fill="none" stroke-width="2"/>
  <path d="M-27 -22h54l-4.5 12h-45z"/>
  <rect x="-24" y="-10" width="48" height="40" rx="4"/>
  <path d="M-24 10h48M-7 0h14M-7 20h14" fill="none"/>
</g>
<text x="382" y="248" class="name" fill="#166534" text-anchor="middle">Cabinet + out-tray</text>
<text x="382" y="270" class="note" fill="#475569" text-anchor="middle">the letter waits in</text>
<text x="382" y="289" class="note" fill="#475569" text-anchor="middle">the tray, by the file</text>
<path d="M304 308h156" stroke="#bbf7d0" stroke-width="1.5"/>
<rect x="337" y="320" width="90" height="26" rx="13" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="382" y="338" class="chip" fill="#15803d" text-anchor="middle">DynamoDB</text>
<text x="382" y="368" class="mono" fill="#166534" text-anchor="middle">OUTBOX#&lt;user&gt;:&lt;rev&gt;</text>
<text x="382" y="387" class="mono" fill="#166534" text-anchor="middle">status: pending</text>

<path d="M488 186h24" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Station 3: mail carrier = outbox publisher -->
<rect x="520" y="128" width="196" height="276" rx="20" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<g transform="translate(624 184)" fill="#ffffff" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-58 -12h8M-62 -2h12M-58 8h8" fill="none"/>
  <rect x="-40" y="-22" width="42" height="32" rx="3"/>
  <path d="M2 -12h13l11 12v10h-24z"/>
  <rect x="-31" y="-15" width="24" height="16" rx="1.5" stroke-width="2"/>
  <path d="M-29.5 -13l10.5 7.5 10.5-7.5" fill="none" stroke-width="2"/>
  <circle cx="-26" cy="14" r="6"/>
  <circle cx="14" cy="14" r="6"/>
</g>
<text x="618" y="248" class="name" fill="#115e59" text-anchor="middle">The mail carrier</text>
<text x="618" y="270" class="note" fill="#475569" text-anchor="middle">posts waiting letters,</text>
<text x="618" y="289" class="note" fill="#475569" text-anchor="middle">then stamps the copy</text>
<path d="M540 308h156" stroke="#99f6e4" stroke-width="1.5"/>
<rect x="547" y="320" width="142" height="26" rx="13" fill="#ffffff" stroke="#5eead4" stroke-width="1.2"/>
<text x="618" y="338" class="chip" fill="#0f766e" text-anchor="middle">Outbox publisher</text>
<text x="618" y="368" class="note" fill="#115e59" text-anchor="middle">every 5 s: send pending</text>
<text x="618" y="387" class="note" fill="#115e59" text-anchor="middle">entries, then mark sent</text>

<path d="M724 186h24" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

<!-- Station 4: post office and recipient = event queue and consumer -->
<rect x="756" y="128" width="196" height="276" rx="20" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
<g transform="translate(850 186)" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-5" y="8" width="10" height="24" rx="1.5"/>
  <path d="M-28 8V-12a12 12 0 0 1 12-12h32a12 12 0 0 1 12 12V8z"/>
  <path d="M-16 8V-12a10 10 0 0 0-10-10" fill="none" stroke-width="2"/>
  <path d="M-12 -6h18" fill="none" stroke-width="2"/>
  <path d="M33 0V-30" fill="none"/>
  <rect x="33" y="-30" width="13" height="9" rx="1.5" fill="#f97316" stroke="#c2410c" stroke-width="1.5"/>
  <path d="M-20 32h40" fill="none"/>
</g>
<text x="854" y="248" class="name" fill="#5b21b6" text-anchor="middle">Post office</text>
<text x="854" y="270" class="note" fill="#475569" text-anchor="middle">delivers every letter</text>
<text x="854" y="289" class="note" fill="#475569" text-anchor="middle">at least once</text>
<path d="M776 308h156" stroke="#ddd6fe" stroke-width="1.5"/>
<rect x="779" y="320" width="150" height="26" rx="13" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
<text x="854" y="338" class="chip" fill="#6d28d9" text-anchor="middle">Queue + consumer</text>
<text x="854" y="368" class="note" fill="#5b21b6" text-anchor="middle">today the consumer only</text>
<text x="854" y="387" class="note" fill="#5b21b6" text-anchor="middle">writes a log line</text>

<!-- Callout A: the API never waits -->
<rect x="48" y="428" width="288" height="136" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<g transform="translate(80 460)" fill="#ffffff" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="-10" y="-16" width="20" height="32" rx="4"/>
  <path d="M-4 -12h8" fill="none"/>
</g>
<circle cx="90" cy="472" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
<path d="M86.5 472.5l2.5 2.5 4.5-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="112" y="466" class="callout" fill="#1e3a8a">The API never waits</text>
<text x="72" y="502" class="note" fill="#1e40af">Premium is read straight from the</text>
<text x="72" y="522" class="note" fill="#1e40af">file. A late letter never delays</text>
<text x="72" y="542" class="note" fill="#1e40af">anyone's access.</text>

<!-- Callout B: carrier stopped -->
<rect x="356" y="428" width="288" height="136" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<use href="#bolt" x="378" y="446" width="20" height="30"/>
<text x="412" y="466" class="callout" fill="#9a3412">Carrier stopped?</text>
<text x="380" y="502" class="note" fill="#9a3412">Letters wait in the tray and go</text>
<text x="380" y="522" class="note" fill="#9a3412">out on the next round. Nothing</text>
<text x="380" y="542" class="note" fill="#9a3412">is lost, only delayed.</text>

<!-- Callout C: crash after posting -->
<rect x="664" y="428" width="288" height="136" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<use href="#bolt" x="686" y="446" width="20" height="30"/>
<text x="720" y="466" class="callout" fill="#9a3412">Crash before the stamp?</text>
<text x="688" y="502" class="note" fill="#9a3412">The letter is posted again. Its</text>
<text x="688" y="522" class="note" fill="#9a3412">reference number tells the</text>
<text x="688" y="542" class="note" fill="#9a3412">recipient it is a copy.</text>

<text x="500" y="596" class="footer" fill="#64748b" text-anchor="middle">Reference number = domainEventId &lt;user-id&gt;:&lt;revision&gt;, identical on every retry</text>
</svg>
