<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
<title id="title">PremiumPass at a glance</title>
<desc id="description">Users buy Premium on the website with Stripe, in the iPhone app through the App Store, or in the Android app through Google Play. The PremiumPass backend translates every store, combines all purchases, and checks the clock. Every app then shows the same answer to the question: is this user Premium right now?</desc>
