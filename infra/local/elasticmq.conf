include classpath("application.conf")

node-address {
  protocol = http
  host = "127.0.0.1"
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
rest-stats.enabled = false
aws {
  region = us-east-1
  accountId = "000000000000"
}
queues {
  premiumpass-subscriptions-dlq {}
  premiumpass-subscriptions {
    defaultVisibilityTimeout = 360 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "premiumpass-subscriptions-dlq"
      maxReceiveCount = 5
    }
  }
}
